<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>RiboTech - Checkout</title>
  <link rel="icon" href="../assets/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/web.css">
  <link rel="stylesheet" href="../assets/css/checkout.css">
  </head>
<body>

<header>
  <div class="nav-inner">
    <a class="logo" href="../index.html">
      <img src="../assets/logo.png" alt="RiboTech Logo">
      Ribo<span>Tech</span>
    </a>
    <nav>
      <a class="nav-btn" href="../index.html">Home</a>
      <a class="nav-btn" href="../pages/catalog.html">Shop</a>
      <a class="cart-btn" href="../pages/cart.html" onclick="cartGuard(event)">Cart <span class="cart-count" id="cartCount">0</span></a>
          <span id="navUserEmail"></span>
      <button id="navAuthBtn" onclick="updateNavAuth()">Login</button>
    </nav>
  </div>
</header>

<div class="checkout-wrap">
  <h1 class="checkout-title">Checkout</h1>
  <p class="checkout-subtitle">Fill in your shipping details below.</p>

  <div class="checkout-grid">
    <div>
      <div class="form-section">
        <div class="form-section-title">Shipping Information</div>
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" placeholder="Name">
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" placeholder="Last Name">
          </div>
        </div>
        <div class="form-row full">
          <div class="form-group">
            <label>Email Address</label>
            <input type="text" placeholder="jason67@gmail.com">
          </div>
        </div>
        <div class="form-row full">
          <div class="form-group">
            <label>Payment Method</label>
            <select id="paymentMethod" onchange="handlePaymentChange()">
              <option value="cod">Cash on Delivery</option>
              <option value="gcash">GCash</option>
              <option value="bank">Bank Payment</option>
            </select>
          </div>
        </div>
        <div class="form-row full">
          <div class="form-group">
            <label>Street Address</label>
            <input type="text" placeholder="Street/Zone, Barangay">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>City</label>
            <input type="text" placeholder="City">
          </div>
          <div class="form-group">
            <label>Province</label>
            <input type="text" placeholder="Province">
          </div>
        </div>
        <div class="form-row full">
          <div class="form-group">
            <label>ZIP Code</label>
            <input type="text" placeholder="3114">
          </div>
        </div>
      </div>

      <button class="place-order-btn" onclick="placeOrder()">Place Order</button>
    </div>

    <div class="checkout-summary">
      <div class="cs-title">Order Summary</div>
      <div id="checkoutItems"></div>
      <hr class="summary-divider">
      <div class="summary-row"><span>Subtotal</span><span id="co-subtotal"></span></div>
      <div class="summary-row"><span>Shipping</span><span class="free-shipping">FREE</span></div>
      <hr class="summary-divider">
      <div class="summary-total"><span>Total</span><span id="co-total"></span></div>
    </div>
  </div>
</div>

<footer><div class="footer-inner"><div class="footer-nav">
    <a href="../index.html">Home</a>
    <a href="../pages/about.html">About Us</a>
    <a href="../pages/contact.html">Contact</a>
    <a href="../pages/cart.html">Cart</a>
  </div>
  <div class="footer-copy">&copy; RiboTech. All rights reserved.</div></div></footer>

<div id="toast"><span class="t-icon"></span><span id="toastMsg"></span></div>

<script>
  updateCartCount();
  renderCheckout();

  function handlePaymentChange() {
    // reserved for future use (e.g. show/hide extra fields per method)
  }
</script>

</div>


<script src="../assets/kali.js"></script>
<script>
  updateCartCount();
  updateNavAuth();
  renderCheckout();

  function handlePaymentChange() {}

  async function placeOrder() {
    var user = getLoggedInUser();
    if (!user) { window.location.href = 'login.html?return=' + encodeURIComponent(window.location.href); return; }
    if (loadCart().length === 0) { showToast('Your cart is empty!'); return; }

    var firstName = document.querySelector('input[placeholder="Name"]').value.trim();
    var lastName  = document.querySelector('input[placeholder="Last Name"]').value.trim();
    var street    = document.querySelector('input[placeholder="Street/Zone, Barangay"]').value.trim();
    var city      = document.querySelector('input[placeholder="City"]').value.trim();

    if (!firstName || !lastName || !street || !city) {
      showToast('Please fill in your shipping details.');
      return;
    }

    var orderNum = 'RBT-' + Math.floor(Math.random() * 900000 + 100000);
    var cart     = loadCart();
    var total    = getCartSubtotal();

    var btn = document.querySelector('.place-order-btn');
    btn.disabled = true;
    btn.textContent = 'Placing order...';

    try {
      var res = await fetch('/api/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: user, orderNumber: orderNum, items: cart, total: total })
      });
      var data = await res.json();
      if (!res.ok) { showToast('Order placed but email failed.'); }
    } catch(e) {
      showToast('Could not send email — check server.');
    }

    saveCart([]);
    updateCartCount();
    window.location.href = 'success.html?order=' + orderNum;
  }
</script>

</body>
</html>

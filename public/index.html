<script>
 updateCartCount();

 // Override nav auth: redirect to login page instead of modal
 function handleNavAuth() {
   var user = getLoggedInUser();
   if (user) { logoutUser(); } else { window.location.href = 'pages/login.html'; }
 }

 // Password show/hide toggle
 function togglePassword(inputId, btn) {
   var input = document.getElementById(inputId);
   var isHidden = input.type === 'password';
   input.type = isHidden ? 'text' : 'password';
   btn.classList.toggle('active', isHidden);
 }

 // Patch updateNavAuth to use handleNavAuth
 (function() {
   var btn = document.getElementById('navAuthBtn');
   if (!btn) return;
   var user = getLoggedInUser();
   var emailEl = document.getElementById('navUserEmail');
   if (user) {
     if (emailEl) emailEl.textContent = user;
     btn.textContent = 'Logout';
     btn.onclick = logoutUser;
   } else {
     btn.textContent = 'Login';
     btn.onclick = function() { window.location.href = 'pages/login.html'; };
   }
 })();
</script>
